<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · instantcodes</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" href="/favicon.png">
<style>
:root{--bg:#FCFCFF;--s:rgba(255,255,255,.66);--b:rgba(22,24,60,.08);--t:#0E1122;--m:#636A85;--ok:#067647;--warn:#B54708;--v:#6D4BFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(40% 40% at 10% 0%,rgba(139,108,255,.18),transparent 70%),radial-gradient(40% 40% at 95% 10%,rgba(56,214,255,.15),transparent 70%),radial-gradient(50% 50% at 60% 100%,rgba(255,120,210,.12),transparent 70%)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--b)}
header img{width:30px;height:30px;border-radius:9px}
header b{font-size:18px;letter-spacing:-.03em}
header a{margin-left:auto;color:var(--m);font-size:13px;text-decoration:none}
.mode{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}
.mode.test{background:#FEF0C7;color:#93370D}.mode.live{background:#DCFAE6;color:var(--ok)}
main{max-width:980px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tabs button{flex:none;border:1.5px solid var(--b);background:var(--s);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;color:var(--t)}
.tabs button.on{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 52%),linear-gradient(135deg,#8B6CFF,#4F46E5);color:#fff;border-color:transparent}
.n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:10px;background:#F04438;color:#fff;font-size:12px;text-align:center}
.card{background:var(--s);border:1px solid var(--b);border-radius:22px;padding:16px;margin-top:12px;-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);box-shadow:0 1px 0 #fff inset,0 14px 34px -24px rgba(60,40,160,.35)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.muted{color:var(--m);font-size:13px}
.st{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;margin-left:6px}
.it{border-top:1px solid var(--b);margin-top:12px;padding-top:12px}
.hold{margin-top:10px;padding:10px 12px;border-radius:12px;background:#FFFAEB;color:#93370D;font-size:14px}
.auto{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:var(--ok)}
input,textarea,select{width:100%;font:inherit;border:1.5px solid var(--b);border-radius:12px;padding:10px 12px;margin-top:6px;background:#fff;color:var(--t)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--t)}
textarea.codes{font-family:ui-monospace,Menlo,monospace;min-height:140px}
.btn{border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn[disabled]{opacity:.5}
.p{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 52%),linear-gradient(135deg,#8B6CFF,#4F46E5);color:#fff;box-shadow:0 8px 20px -10px rgba(91,75,240,.8)}.r{background:#FEE4E2;color:#B42318}.g{background:var(--bg);color:var(--t);border:1.5px solid var(--b)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
code{font-family:ui-monospace,Menlo,monospace;background:#F6F7FA;padding:4px 8px;border-radius:8px;display:inline-block;margin:6px 6px 0 0;word-break:break-all}
.empty{text-align:center;color:var(--m);padding:40px 10px}
label.chk{display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:600}
label.chk input{width:auto;margin:0}
.grid2{display:grid;gap:10px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--m);margin-top:10px}
.stock{width:100%;border-collapse:collapse;font-size:14px}
.stock td{padding:9px 6px;border-top:1px solid var(--b);vertical-align:top}
.stock tr:first-child td{border-top:0}
.chip{display:inline-block;margin:2px 4px 2px 0;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--b);font-size:13px;white-space:nowrap}
.chip.zero{background:#FEF3F2;border-color:#FECDCA;color:#B42318}
.chip i{font-style:normal;color:var(--warn);font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--t);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.pfil{display:grid;grid-template-columns:1fr 200px;gap:8px;margin-top:12px}
.plist{margin-top:12px;background:var(--s);border:1px solid var(--b);border-radius:18px;overflow:hidden}
.prow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--b)}
.prow:first-child{border-top:0}
.prow.off{opacity:.55}
.thumb{width:96px;aspect-ratio:1.586;border-radius:10px;display:grid;place-items:center;overflow:hidden;font-weight:800;font-size:11px;text-align:center;padding:6px;line-height:1.1;box-shadow:0 4px 10px rgba(11,15,25,.12)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pacts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.sw{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;cursor:pointer;color:var(--m)}
.sw input{appearance:none;-webkit-appearance:none;width:38px;height:22px;margin:0;padding:0;border:0;border-radius:11px;background:#D0D5DD;cursor:pointer;position:relative;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked{background:var(--ok)}
.sw input:checked::after{transform:translateX(16px)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--m);background:var(--bg);border:1px solid var(--b);border-radius:6px;padding:1px 6px;margin-left:6px}
.stars{color:#F79009;letter-spacing:1px}
.pl{display:grid;gap:8px}.plr{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--b)}.plr:first-child{border-top:0}
.plv{width:84px;height:36px;border:1px solid var(--b);border-radius:8px;display:grid;place-items:center;background:#fff;overflow:hidden}.plv img{max-width:90%;max-height:80%}.plv i{font-size:11px;color:var(--m);font-style:normal}
.rv.hid{opacity:.55}
@media(max-width:640px){.prow{grid-template-columns:72px minmax(0,1fr)}.thumb{width:72px}.pacts{grid-column:1/-1;justify-content:flex-start}.pfil{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{padding:14px;border-radius:18px;background:var(--s);border:1px solid var(--b);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.kpi small{display:block;color:var(--m);font-size:12.5px}.kpi b{display:block;font-size:22px;letter-spacing:-.02em;margin-top:2px}
.svc{display:grid;gap:10px;margin-top:12px}@media(min-width:760px){.svc{grid-template-columns:repeat(2,minmax(0,1fr))}}
.svc .card{margin-top:0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#D0D5DD}.dot.ok{background:#12B76A}.dot.warn{background:#F79009}.dot.bad{background:#F04438}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.links a{font-size:13px;font-weight:700;color:var(--t);text-decoration:none;padding:7px 12px;border-radius:999px;border:1px solid var(--b);background:#fff}
.drop{margin-top:10px;border:1.5px dashed rgba(109,75,255,.35);border-radius:16px;padding:18px;text-align:center;background:rgba(109,75,255,.04);cursor:pointer}
.drop.on{background:rgba(109,75,255,.1)}
table.pv{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}table.pv td{padding:8px 6px;border-top:1px solid var(--b)}
.warnbox{margin-top:10px;padding:10px 12px;border-radius:12px;background:#FFFAEB;color:#93370D;font-size:13.5px}
/* Abos */
.ahint{margin-top:10px;padding:10px 12px;border-radius:12px;background:#EEF4FF;color:#1D3A8A;font-size:14px}
.ah{margin:24px 4px 0;font-size:17px;letter-spacing:-.01em}
.ah small{font-weight:600;color:var(--m);font-size:13px;margin-left:6px}
.aerow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) minmax(0,1.2fr) minmax(0,1.6fr) auto;gap:8px;align-items:center;margin-top:8px}
.aerow select,.aerow input{margin:0}
@media(max-width:760px){.aerow{grid-template-columns:1fr 1fr;padding:10px 0;border-top:1px solid var(--b)}.aerow input{grid-column:1/-1}}
details.adet{margin-top:10px}details.adet summary{cursor:pointer;font-weight:700;color:var(--m);font-size:14px}
.alist{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}.alist td{padding:7px 6px;border-top:1px solid var(--b);vertical-align:top}
.ok{color:var(--ok)}.bad{color:#B42318}
/* Anmeldung: Anbieter-Karten */
.auc{scroll-margin-top:72px}.auc .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.auc .hd img{width:26px;height:26px;object-fit:contain}.auc .hd b{font-size:17px}
.ust{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}.ust.ok{color:#067647;background:#DCFAE6}.ust.miss{color:#475467;background:#F2F4F7}.ust.err{color:#B42318;background:#FEE4E2}.ust.sim{color:#93370D;background:#FEF0C7}
.auu{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}.auu small{display:block;width:100%;color:var(--m);font-size:12.5px;font-weight:700;margin-top:4px}.auu code{margin:0;flex:1 1 240px;min-width:0}
.aures{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:13.5px}.aures.ok{background:#ECFDF3;color:#067647}.aures.bad{background:#FEF3F2;color:#B42318}.aures.info{background:#F2F4F7;color:#344054}
.envnote{display:block;margin-top:4px;font-size:12px;color:var(--m)}.auf .sw{margin-top:12px}
.auc ol{margin:8px 0 0;padding-left:20px}.auc ol li{margin:4px 0;font-size:14px}
.p8{margin-top:6px;border:1.5px dashed rgba(109,75,255,.35);border-radius:14px;padding:12px;text-align:center;background:rgba(109,75,255,.04);cursor:pointer;font-size:14px}
.ausum{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.ausum a{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--b);background:#fff;font-size:13px;font-weight:700;color:var(--t);text-decoration:none}
.ausum img{width:16px;height:16px;object-fit:contain}
/* E-Mails und Newsletter */
.mv{display:grid;gap:12px;margin-top:12px}@media(min-width:900px){.mv{grid-template-columns:250px minmax(0,1fr);align-items:start}}
.mv-l{display:grid;gap:4px;align-content:start}@media(min-width:900px){.mv-l{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}}
.mv-g{font-size:12px;font-weight:800;color:var(--m);margin:10px 6px 2px}
.mv-i{display:block;width:100%;text-align:left;border:1px solid var(--b);background:var(--s);border-radius:12px;padding:8px 10px;font:inherit;cursor:pointer;color:var(--t)}
.mv-i b{display:block;font-size:13.5px}.mv-i small{display:block;color:var(--m);font-size:12px;line-height:1.35;margin-top:2px}.mv-i.on{border-color:var(--t);background:#fff}
.mv-r{margin-top:0;min-width:0}.mv-f{margin-top:12px;overflow:auto;background:#E9EBEF;border-radius:14px;padding:12px 0;text-align:center}
.mv-f iframe,.mv-pf{display:block;margin:0 auto;border:0;background:#F3F4F6;height:900px;max-width:none}.mv-pf{width:100%;margin-top:10px;border-radius:12px}
.mv-t{text-align:left;white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;margin:0 12px;padding:14px;background:#fff;border-radius:10px;max-height:900px;overflow:auto}
</style>
</head>
<body>
<header><img src="/logo.svg" alt=""><b>instantcodes Admin</b><span id="mode"></span><a href="/">Zum Shop</a></header>
<main id="m"><p class="muted">Lade …</p></main>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{"use strict";
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=c=>(c/100).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
async function API(p,o={}){const r=await fetch("/api"+p,{method:o.method||"GET",headers:{"Content-Type":"application/json","X-IC":"1"},body:o.body?JSON.stringify(o.body):undefined,credentials:"same-origin"});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||"Fehler "+r.status);return j}
const TABS=[["overview","Übersicht"],["processing","Prüfen"],["abos","Abos"],["payment_pending","Zahlung läuft"],["delivered","Geliefert"],["refunded","Erstattet"],["canceled","Storniert"],["all","Alle"],["stock","Code-Lager"],["products","Produkte"],["reviews","Bewertungen"],["reloadly","Reloadly"],["anmeldung","Anmeldung"],["mails","E-Mails"],["newsletter","Newsletter"]];
const STC={awaiting_payment:"#B54708",payment_pending:"#B54708",processing:"#3B5BDB",delivered:"#067647",canceled:"#6B7280",refunded:"#6B7280"};
const STN={awaiting_payment:"Warte auf Zahlung",payment_pending:"Zahlung läuft",processing:"Prüfen",delivered:"Geliefert",canceled:"Storniert",refunded:"Erstattet"};
let tab="overview",timer,tt,counts={},mode=null;
const toast=t=>{const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2800)};
const typing=()=>[...document.querySelectorAll("main input:not([type=checkbox]),main textarea")].some(i=>i.value);
const setMode=j=>{if(j.testmode==null)return;mode=j;$("#mode").innerHTML=j.testmode?`<span class="mode test">Testmodus</span>`:`<span class="mode live">Live</span>`};
let aboN=0,aboU=0; /* Abo-Lieferungen zur Freigabe, Kündigungen ohne Zuordnung */
let authErrN=0; /* Anmelde-Anbieter mit Fehler */
const badgeN=k=>k==="processing"?(counts.processing||0)+aboN:k==="abos"?aboN+aboU:k==="anmeldung"?authErrN:0;
const tabsHTML=()=>`<div class="tabs">${TABS.map(t=>`<button class="${t[0]===tab?"on":""}" data-tab="${t[0]}">${t[1]}${badgeN(t[0])?`<span class="n">${badgeN(t[0])}</span>`:""}</button>`).join("")}</div>`;

async function load(force){
  clearTimeout(timer);
  if(tab==="stock"){if(force)loadStock();return}
  if(tab==="products"){if(force)loadProducts();return}
  if(tab==="reviews"){if(force)loadReviews();return}
  if(tab==="reloadly"){if(force)loadRL();return}
  if(tab==="overview"){if(force)loadOV();return}
  if(tab==="abos"){if(force)loadAbos();return}
  if(tab==="mails"){if(force)loadMails();return}
  if(tab==="newsletter"){if(force)loadNL();return}
  if(tab==="anmeldung"){if(force)loadAuth();return}
  timer=setTimeout(()=>load(),30000);
  if(!force&&typing())return;
  try{const [j,ap]=await Promise.all([API("/admin/orders?status="+tab),API("/admin/abos/pending").catch(()=>null)]);counts=j.counts||{};if(ap){aboN=ap.count;aboU=ap.unmatched}setMode(j);render(j)}catch(e){$("#m").innerHTML=`<div class="card">${esc(e.message)}</div>`}
}
function render(j){
  document.title=(counts.processing?`(${counts.processing}) `:"")+"Admin · instantcodes";
  $("#m").innerHTML=tabsHTML()+(tab==="processing"?`<div id="aboPend"></div>`:"")+(j.orders.length?j.orders.map(card).join(""):`<div class="empty">${tab==="processing"?"Nichts zu prüfen. Bezahlte Bestellungen werden automatisch ausgeliefert.":"Keine Bestellungen in dieser Ansicht."}</div>`);
  if(tab==="processing"&&aboN)fillAboPend();
}
const fill=i=>i.stock==null?"leer lassen: Testcode wird erzeugt":i.stock>0?`leer lassen: aus Lager (${i.stock} frei)`:"Lager leer, bitte Code eintragen";
function card(o){
  const open=o.status==="processing";
  return `<div class="card" data-o="${esc(o.id)}"><div class="row"><div><b>${esc(o.id)}</b><span class="st" style="color:${STC[o.status]};background:${STC[o.status]}1a">${STN[o.status]||esc(o.status)}</span>${o.delivered_by==="auto"?`<span class="auto">automatisch</span>`:""}
   <div class="muted">${new Date(o.created_at).toLocaleString("de-DE")} · ${esc(o.email)}${o.paid_at?" · bezahlt "+new Date(o.paid_at).toLocaleString("de-DE"):""}</div></div><b>${eur(o.total)}</b></div>
   ${open&&o.hold_reason?`<div class="hold"><b>Nicht automatisch geliefert:</b> ${esc(o.hold_reason)}</div>`:""}
   ${o.items.map(i=>`<div class="it"><b>${esc(i.name)} ${eur(i.face)}</b> × ${i.qty} <span class="muted">${i.type==="topup"?"Aufladung für "+esc(i.phone):i.gift_to?"Geschenk an "+esc(i.gift_to)+(i.gift_from?" von "+esc(i.gift_from):""):"Code"}</span>${i.gift_msg?`<div class="muted">„${esc(i.gift_msg)}“</div>`:""}
    ${open?(i.type==="topup"?`<label class="chk"><input type="checkbox" data-done="${i.id}"> Aufladung beim Anbieter ausgeführt</label><input placeholder="Referenz oder Transaktionsnummer (optional)" data-ref="${i.id}">`
      :Array.from({length:i.qty},(_,k)=>`<input placeholder="Code${i.qty>1?" "+(k+1):""} · ${fill(i)}" data-code="${i.id}" autocomplete="off" autocapitalize="characters" spellcheck="false">`).join(""))
      :(i.codes&&i.codes.length?`<div>${i.codes.map(x=>`<code>${esc(x)}</code>`).join("")}</div>`:"")}</div>`).join("")}
   ${open?`<textarea placeholder="Interne Notiz (optional, sieht nur das Team)" data-note rows="2"></textarea><div class="acts"><button class="btn p" data-deliver="${esc(o.id)}">Ausliefern und E-Mail senden</button><button class="btn g" data-rlbuy="${esc(o.id)}">Über Reloadly kaufen und ausliefern</button><button class="btn r" data-refund="${esc(o.id)}">Erstatten</button></div>`:o.note?`<div class="muted" style="margin-top:10px">Notiz: ${esc(o.note)}</div>`:""}
   ${o.status==="payment_pending"?`<div class="acts"><button class="btn r" data-refund="${esc(o.id)}">Erstatten</button></div>`:""}</div>`;
}

/* ---------- Code-Lager ---------- */
let S=null;
async function loadStock(){
  try{S=await API("/admin/stock");setMode(S);renderStock()}catch(e){$("#m").innerHTML=tabsHTML()+`<div class="card">${esc(e.message)}</div>`}
}
const optP=()=>S.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
const optA=id=>{const p=S.products.find(x=>x.id===id)||S.products[0];return p.amts.map(a=>`<option value="${a.a}">${esc(a.label||a.a+" €")}</option>`).join("")};
function renderStock(){
  const r=S.rules,t=S.testmode;
  const chips=p=>p.amts.map(a=>{const free=t?a.test_free:a.free;return `<span class="chip${!t&&!a.free?" zero":""}">${a.a} € · <b>${free}</b> frei${t&&a.free?` · <i>${a.free} echt</i>`:""}</span>`}).join("");
  $("#m").innerHTML=tabsHTML()+`
  <div class="card"><b>So wird ausgeliefert</b>
   <p class="muted" style="margin:6px 0 0">${r.auto?`Bezahlte Bestellungen gehen sofort raus, wenn der Bestellwert bis ${eur(r.max)} beträgt, der Kunde heute nicht mehr als ${eur(r.day)} automatisch bekommen hat und Stripe das Risiko als normal einstuft. Handy-Aufladungen und alles andere landen unter „Prüfen“.`:"Automatische Auslieferung ist ausgeschaltet (AUTO_DELIVERY=0). Alle Bestellungen landen unter „Prüfen“."}</p>
   ${t?`<p class="muted" style="margin:8px 0 0"><b style="color:#93370D">Testmodus:</b> Testkäufe bekommen nur Testcodes. ${S.generator?"Fehlen welche, erzeugt der Generator sie automatisch.":""} Echte Codes bleiben für den Live-Betrieb reserviert.</p>`:`<p class="muted" style="margin:8px 0 0"><b style="color:#067647">Live:</b> Es werden nur echte Codes aus dem Lager verkauft. Leere Beträge erscheinen im Shop als ausverkauft.</p>`}
  </div>
  <div class="grid2">

/* ---------- Bewertungen ----------
   Alle Bewertungen stammen aus gelieferten Bestellungen (eine pro Bestellung). Sie sind sofort sichtbar;
   ausblenden nur bei Regelverstößen (Beleidigungen, persönliche Daten, Werbung), nicht wegen schlechter Sterne. */
let R=null,RTP=null,RF="all";
async function loadReviews(){
  try{const j=await API("/admin/reviews");R=j.reviews;RTP=j.trustpilot;renderReviews()}catch(e){$("#m").innerHTML=tabsHTML()+`<div class="card">${esc(e.message)}</div>`}
}
function renderReviews(){
  const vis=R.filter(r=>!r.hidden),avg=vis.length?vis.reduce((s,r)=>s+r.rating,0)/vis.length:0;
  /* je Produkt (aus der Bestellung): Anzahl und Schnitt der sichtbaren Bewertungen */
  const by={};vis.forEach(r=>(r.ids||[]).forEach(id=>{const x=by[id]=by[id]||{n:0,s:0};x.n++;x.s+=r.rating}));
  const prods=Object.entries(by).sort((a,b)=>b[1].n-a[1].n);
  const list=R.filter(r=>RF==="all"||(RF==="hidden"?r.hidden:!r.hidden)).filter(r=>!RF.startsWith("p:")||(r.ids||[]).includes(RF.slice(2)));
  const f=(v,t)=>`<button class="${RF===v?"on":""}" data-rf="${esc(v)}">${t}</button>`;
  $("#m").innerHTML=tabsHTML()+`<div class="card"><b>Bewertungen aus echten Bestellungen</b>
   <p class="muted" style="margin:6px 0 0">Nur Kunden mit gelieferter Bestellung können bewerten, eine Bewertung pro Bestellung. Neue Bewertungen sind sofort sichtbar. Auf der Startseite erscheinen sie ab 3 sichtbaren Bewertungen, auf der Produktseite ab der ersten (immer mit Anzahl). Verstecke nur Beiträge, die gegen Regeln verstoßen (Beleidigungen, persönliche Daten, Spam), nicht einfach schlechte Bewertungen.</p>
   <p style="margin:10px 0 0"><b>${vis.length}</b> sichtbar${vis.length?` · Durchschnitt <b>${avg.toFixed(1).replace(".",",")}</b> <span class="stars">★</span>`:""}${R.length-vis.length?` · ${R.length-vis.length} versteckt`:""}</p>
   ${prods.length?`<p style="margin:10px 0 0">${prods.map(([id,x])=>`<span class="chip">${esc(id)} <i>${(x.s/x.n).toFixed(1).replace(".",",")} ★</i> · ${x.n}</span>`).join("")}</p>`:""}
   <p class="muted" style="margin:10px 0 0">Trustpilot: ${RTP?`Link „Bewerte uns auf Trustpilot“ aktiv (<a href="${esc(RTP.url)}" target="_blank" rel="noopener">${esc(RTP.url)}</a>)${RTP.widget?", Widget mit Sternen eingerichtet (lädt nach Cookie-Einwilligung)":", Widget nicht eingerichtet (TRUSTPILOT_BUSINESS_ID und TRUSTPILOT_TEMPLATE_ID fehlen)"}`:"ausgeschaltet (TRUSTPILOT_URL=aus)"}.</p>
   <div class="tabs" style="margin-top:12px">${f("all","Alle")}${f("visible","Sichtbar")}${f("hidden","Versteckt")}${prods.slice(0,8).map(([id])=>f("p:"+id,esc(id))).join("")}</div></div>`+
   (list.length?list.map(r=>`<div class="card rv${r.hidden?" hid":""}"><div class="row"><div><span class="stars">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</span> <b>${esc(r.name)}</b>${r.hidden?`<span class="st" style="color:#6B7280;background:#6B72801a">versteckt</span>`:""}
     <div class="muted">${new Date(r.created_at).toLocaleString("de-DE")} · ${esc(r.email)} · ${esc(r.order_id)}${r.brands.length?" · "+esc(r.brands.join(", ")):""}</div></div>
     <button class="btn ${r.hidden?"g":"r"} sm" data-rhide="${r.id}" data-h="${r.hidden?0:1}">${r.hidden?"Wieder anzeigen":"Verstecken"}</button></div>
     ${r.text?`<p style="margin:10px 0 0">${esc(r.text)}</p>`:""}</div>`).join(""):`<div class="empty">${R.length?"Keine Bewertungen in dieser Auswahl.":"Noch keine Bewertungen. Nach jeder Lieferung bekommt der Kunde in der E-Mail einen Link zum Bewerten; im Konto steht bei gelieferten Bestellungen „Bewerten“."}</div>`);
}

   <textarea data-anote placeholder="Interne Notiz (optional, sieht nur das Team)" rows="2"></textarea>
   <div class="acts"><button class="btn p" data-adeliver="${d.id}">Freigeben und E-Mail senden</button>${AB&&AB.reloadly?`<button class="btn g" data-arl="${d.id}">Über Reloadly kaufen und freigeben</button>`:""}<button class="btn r" data-askip="${d.id}">Nicht liefern</button></div></div>`}
function aboSub(s){

const aeVal=list=>list.reduce((s,i)=>s+Math.round(i.a*100),0);

function aboEditor(){

  const amts=(id,a)=>{const p=prods.find(x=>x.id===id);return p?p.amts.map((x,i)=>`<option value="${x}"${x===a?" selected":""}>${p.labels&&p.labels[i]?esc(p.labels[i])+" · ":""}${eur(Math.round(x*100))}</option>`).join(""):""};
  const ev=e=>AB.every.map(x=>`<option value="${x}"${x===e?" selected":""}>${EVN[x]||x+" Monate"}</option>`).join("");
  return `<div class="tabs" style="margin:0">${AB.plans.map(p=>`<button class="${p.id===ABP?"on":""}" data-aplan="${p.id}">${esc(p.name)}</button>`).join("")}</div>
   <p class="muted" style="margin:10px 0 0">Gilt für Lieferungen, die ab jetzt angelegt werden; schon angelegte behalten ihren Inhalt. Der Abstand legt fest, wie oft ein Code kommt – Codes mit 3 Monaten Laufzeit also „alle 3 Monate“. Die Bezeichnung sehen Kunden auf der Abo-Seite und in den E-Mails.</p>
   <div>${items.map((it,k)=>`<div class="aerow" data-k="${k}"><select data-ae="brand" aria-label="Produkt">${opt(it.brand)}</select><select data-ae="a" aria-label="Betrag">${amts(it.brand,it.a)}</select><select data-ae="every" aria-label="Abstand">${ev(it.every)}</select><input data-ae="label" aria-label="Bezeichnung" placeholder="Bezeichnung (optional)" value="${esc(it.label||"")}"><button class="btn r sm" data-aedel="${k}">Entfernen</button></div>`).join("")}</div>
   <div class="acts"><button class="btn g" data-aeadd>Code hinzufügen</button></div>
   <p class="muted" id="aesum">${aeSum()}</p>
   <label class="chk"><input type="checkbox" id="aeall"> Für alle drei Pläne übernehmen</label>
   <div class="acts"><button class="btn p" data-aesave>Paket speichern</button><button class="btn g" data-aereset>Änderungen verwerfen</button></div>`}
function drawAbos(){

  $("#m").innerHTML=tabsHTML()+`
  <div class="kpis">
   <div class="kpi"><small>Laufende Abos</small><b>${t.running}</b><small>${a.plans.map(p=>`${esc(p.name)} ${p.running}`).join(" · ")}</small></div>
   <div class="kpi"><small>Einnahmen nach Erstattungen</small><b>${eur(net)}</b><small>${eur(t.refunded)} erstattet${t.refund_due?` · <b class="bad">${eur(t.refund_due)} offen</b>`:""}</small></div>
   <div class="kpi"><small>Code-Wert geliefert</small><b>${eur(t.delivered)}</b><small>Saldo <b class="${net-t.delivered<0?"bad":"ok"}">${eur(net-t.delivered)}</b></small></div>
   <div class="kpi"><small>Wartet auf Freigabe</small><b style="color:${a.pending.length?"#B54708":"inherit"}">${a.pending.length}</b><small>Code-Wert ${eur(t.pending)}</small></div>
  </div>
  <div class="card"><b>Kosten gegenüber Einnahmen</b><p class="muted" style="margin:4px 0 0">Code-Wert = Nennwert der Codes im Paket. Dein Einkaufspreis (z. B. bei Reloadly) kann etwas darunter liegen.</p>
   <table class="stock" style="margin-top:8px"><tr><td><b>Plan</b></td><td><b>Preis</b></td><td><b>Einnahmen pro Monat</b></td><td><b>Code-Wert pro Monat (Schnitt)</b></td><td><b>Differenz pro Monat</b></td><td><b>Code-Wert erste Laufzeit</b></td></tr>
   ${a.plans.map(p=>`<tr><td>${esc(p.name)}</td><td>${eur(p.price)}${p.months>1?` / ${p.months} Monate`:" / Monat"}</td><td>${eur(p.perMonth)}</td><td>${eur(p.avgValue)}</td><td class="${p.perMonth-p.avgValue<0?"bad":"ok"}">${eur(p.perMonth-p.avgValue)}</td><td>${eur(p.termValue)}</td></tr>`).join("")}</table></div>
  <div class="card"><b>Stripe-Abgleich</b><p class="muted" style="margin:4px 0 0">Holt verpasste Abo-Ereignisse aus Stripe nach: bezahlte Rechnungen (Verlängerungen), Kündigungen, beendete Abos und Kündigungen, die noch nicht an Stripe übertragen wurden. Läuft zusätzlich alle 6 Stunden automatisch.</p>
   <div class="acts"><button class="btn g" data-async>Fehlende Ereignisse in Stripe ergänzen</button></div><div id="asyncOut"></div></div>
  <h3 class="ah">Lieferungen zur Freigabe<small>${a.pending.length?`${a.pending.length} offen`:"alles erledigt"}</small></h3>${a.pending.length?a.pending.map(aboDel).join(""):`<div class="empty">Keine Abo-Lieferung wartet. Neue Monate legt der Shop automatisch an.</div>`}
  <h3 class="ah">Kündigungen<small>${open.length?`${open.length} ohne Zuordnung`:"alle zugeordnet"}</small></h3>${a.cancels.length?a.cancels.slice(0,30).map(aboCancel).join(""):`<div class="empty">Noch keine Kündigungen.</div>`}
  <h3 class="ah">Abos<small>${a.subs.length}</small></h3>${a.subs.length?a.subs.map(aboSub).join(""):`<div class="empty">Noch keine Abos.</div>`}
  <h3 class="ah">Inhalt der Pakete</h3><div class="card" id="aeBox">${aboEditor()}</div>`;
}
const aeDraw=()=>{const b=$("#aeBox");if(b)b.innerHTML=aboEditor()};
const aboReload=()=>tab==="abos"?loadAbos():load(true);
document.addEventListener("change",e=>{const f=e.target.closest("[data-ae]");if(!f||!ABE)return;const k=+f.closest("[data-k]").dataset.k,it=ABE[ABP][k],key=f.dataset.ae;
  if(key==="brand"){const p=AB.products.find(x=>x.id===f.value);it.brand=f.value;it.a=p?p.amts[0]:0;aeDraw();return}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-adeliver],[data-arl],[data-askip],[data-arefund],[data-async],[data-acassign],[data-aplan],[data-aeadd],[data-aedel],[data-aesave],[data-aereset]");if(!t)return;
  const box=t.closest("[data-ad]");
  if(t.dataset.adeliver||t.dataset.arl){const id=t.dataset.adeliver||t.dataset.arl,rl=!!t.dataset.arl;
    const items=[...box.querySelectorAll("[data-acode]")].map(i=>({i:+i.dataset.acode,code:i.value.trim()})).filter(x=>x.code);
    if(!confirm(rl?"Fehlende Codes jetzt bei Reloadly kaufen und die Lieferung freigeben? Das kostet Reloadly-Guthaben.":"Lieferung freigeben? Der Kunde bekommt die Codes sofort per E-Mail."))return;
    t.disabled=true;try{await API(`/admin/abos/deliveries/${id}/deliver`,{method:"POST",body:{items,reloadly:rl,note:(box.querySelector("[data-anote]")||{}).value||""}});box.querySelectorAll("input,textarea").forEach(i=>i.value="");toast("Freigegeben, E-Mail ist raus");aboReload()}catch(x){alert(x.message);t.disabled=false}return}
  if(t.dataset.askip){const note=prompt("Warum wird dieser Monat nicht geliefert? (nur intern sichtbar)","Missbrauchsverdacht");if(note===null)return;
    t.disabled=true;try{await API(`/admin/abos/deliveries/${t.dataset.askip}/skip`,{method:"POST",body:{note}});toast("Als nicht geliefert markiert. Denk an eine Erstattung, falls nötig.");aboReload()}catch(x){alert(x.message);t.disabled=false}return}
  if(t.dataset.arefund){const def=t.dataset.amt?(+t.dataset.amt/100).toFixed(2).replace(".",","):"";const v=prompt("Betrag in Euro, der über Stripe erstattet wird:",def);if(v===null)return;
    const c=Math.round(parseFloat(String(v).replace(",","."))*100);if(!(c>0))return alert("Bitte einen Betrag eingeben.");
    const reason=prompt("Grund (steht in der E-Mail an den Kunden):","Anteilige Erstattung für nicht gelieferte Monate nach deiner Kündigung");if(reason===null)return;
    t.disabled=true;try{await API(`/admin/abos/${encodeURIComponent(t.dataset.arefund)}/refund`,{method:"POST",body:{amount:c,reason}});toast(`${eur(c)} erstattet`);aboReload()}catch(x){alert(x.message);t.disabled=false}return}
  if(t.hasAttribute("data-async")){t.disabled=true;t.textContent="Abgleich läuft …";try{const j=await API("/admin/abos/sync",{method:"POST",body:{}});toast("Abgleich fertig");await loadAbos();const o=$("#asyncOut");if(o)o.innerHTML=`<p class="muted" style="margin:10px 0 0">${j.checked} Abos geprüft · ${j.periods} fehlende Zahlungen ergänzt · ${j.changed} Status geändert · ${j.deliveries} neue Lieferungen${j.errors.length?`<br><span class="bad">${j.errors.map(esc).join("<br>")}</span>`:""}</p>`}catch(x){alert(x.message);t.disabled=false;t.textContent="Fehlende Ereignisse in Stripe ergänzen"}return}
  if(t.dataset.acassign){const id=t.dataset.acassign,v=(document.querySelector(`[data-acsub="${id}"]`)||{}).value||"";if(!v.trim())return alert("Bitte die Vertragsnummer (AB-…) eintragen.");
    t.disabled=true;try{await API(`/admin/abos/cancels/${encodeURIComponent(id)}/assign`,{method:"POST",body:{sub:v.trim()}});toast("Zugeordnet, Bestätigung ist raus");loadAbos()}catch(x){alert(x.message);t.disabled=false}return}
  if(t.dataset.aplan){ABP=t.dataset.aplan;aeDraw();return}
  if(t.hasAttribute("data-aeadd")){const p=AB.products.find(x=>x.id==="netflix")||AB.products[0];ABE[ABP].push({brand:p.id,a:p.amts[0],every:1,label:null});aeDraw();return}
  if(t.dataset.aedel){ABE[ABP].splice(+t.dataset.aedel,1);aeDraw();return}
  if(t.hasAttribute("data-aereset")){ABE=clone(AB.content);aeDraw();return}
  if(t.hasAttribute("data-aesave")){const all=$("#aeall")&&$("#aeall").checked;if(all&&!confirm("Dieses Paket für Pro, Premium und Max übernehmen?"))return;
    t.disabled=true;try{const j=await API("/admin/abos/content",{method:"POST",body:{plan:ABP,items:ABE[ABP],all}});AB.plans=j.plans.map(p=>Object.assign(p,{running:(AB.plans.find(x=>x.id===p.id)||{}).running||0}));AB.content=j.content;ABE=clone(j.content);drawAbos();toast("Paket gespeichert")}catch(x){alert(x.message);t.disabled=false}return}
});

const AU_MARK={google:"/auth/google.svg",apple:"/auth/apple.svg",paypal:"/auth/paypal.svg",microsoft:"/auth/microsoft.svg",discord:"/auth/discord.svg",twitch:"/auth/twitch.svg",steam:"/auth/steam.svg",amazon:"/auth/amazon.svg"};
const AU_ST={ok:["ok","eingerichtet"],missing:["miss","fehlt"],error:["err","Fehler"]};
const auDate=t=>t?new Date(t).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"}):"";
async function loadAuth(){try{AU=await API("/admin/auth");authErrN=AU.providers.filter(p=>p.status==="error").length;drawAuth();
  const qp=new URLSearchParams(location.search),pr=qp.get("probe");if(pr){const c=document.getElementById("au-"+pr);if(c)c.scrollIntoView({block:"start"});const v=AU.providers.find(x=>x.id===pr);
    if(v)toast(v.last.err&&v.last.errAt>=(v.last.probeAt||0)?v.last.err:(v.last.probe||"Probe-Anmeldung beendet"));try{history.replaceState(null,"","/admin")}catch(e){}}}
  catch(e){$("#m").innerHTML=tabsHTML()+`<div class="card">${esc(e.message)}</div>`}}
function auField(p,f){
  const id=`au_${p}_${f.k}`,dis=f.env?" disabled":"",envN=f.env?`<span class="envnote">Kommt aus der Railway-Variable ${esc(f.env)} (hat Vorrang).</span>`:f.envName?`<span class="envnote">Alternativ als Railway-Variable ${esc(f.envName)}.</span>`:"";
  if(f.type==="switch")return `<label class="sw"><input type="checkbox" id="${id}" data-f="${f.k}"${f.value?" checked":""}${dis}> ${esc(f.label)}</label>${f.env?envN:""}`;
  if(f.type==="file")return `<label class="lbl" for="${id}">${esc(f.label)}</label><div class="p8" data-p8="${p}">${f.set?`<b>gesetzt</b> · `:""}<span id="${id}_n">${f.set?"Neue Datei wählen, um sie zu ersetzen":".p8-Datei hierher ziehen oder tippen"}</span></div><input type="file" id="${id}" data-p8file="${p}" accept="${esc(f.accept||"")}" hidden${dis}>${envN}`;
  if(f.secret)return `<label class="lbl" for="${id}">${esc(f.label)}${f.opt?" (optional)":""}</label><input id="${id}" data-f="${f.k}" type="password" autocomplete="new-password" spellcheck="false" placeholder="${esc(f.set?f.hint+" – leer lassen = unverändert":"Wert einfügen")}"${dis}>${envN}`;
  return `<label class="lbl" for="${id}">${esc(f.label)}${f.opt?" (optional)":""}</label><input id="${id}" data-f="${f.k}" value="${esc(f.value||"")}" placeholder="${esc(f.ph||"")}" spellcheck="false" autocomplete="off"${dis}>${envN}`;
}
function auCard(v){
  const g=v.guide||{},st=AU_ST[v.status]||AU_ST.missing,l=v.last||{};
  const uris=v.redirect.concat(v.origins).map(u=>`<div class="auu"><small>${esc(u.label)}</small><code>${esc(u.v)}</code><button class="btn g sm" data-copy="${esc(u.v)}">Kopieren</button></div>`).join("");
  const res=[l.err?`<div class="aures bad"><b>Fehler${l.errAt?" · "+auDate(l.errAt):""}:</b> ${esc(l.err)}</div>`:"",
    l.test?`<div class="aures ${l.testOk?"ok":"bad"}"><b>Test${l.testAt?" · "+auDate(l.testAt):""}:</b> ${esc(l.test)}</div>`:"",
    l.probe?`<div class="aures ok"><b>${l.probeAt?auDate(l.probeAt)+" · ":""}</b>${esc(l.probe)}</div>`:"",
    l.okAt&&!l.err?`<div class="aures info">Letzte echte Anmeldung: ${auDate(l.okAt)}</div>`:"",
    v.decryptError?`<div class="aures bad">Die gespeicherten Daten lassen sich nicht entschlüsseln (CODES_KEY geändert?). Bitte neu eintragen.</div>`:""].join("");
  return `<div class="card auc" id="au-${v.id}" data-auth="${v.id}">
   <div class="row"><div class="hd">${AU_MARK[v.id]?`<img src="${AU_MARK[v.id]}" alt="">`:`<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="#0E1122" fill-rule="evenodd" d="M9 2h6a3 3 0 013 3v14a3 3 0 01-3 3H9a3 3 0 01-3-3V5a3 3 0 013-3zm1.2 16a1 1 0 000 2h3.6a1 1 0 000-2z"/></svg>`}<b>${esc(v.name)}</b><span class="ust ${st[0]}">${st[1]}</span>${v.sim?`<span class="ust sim">Simulation aktiv</span>`:""}${v.gis?`<span class="ust miss">Google-Knopf (ohne Secret)</span>`:""}</div></div>
   <p class="muted" style="margin:8px 0 0">${esc(g.note||"")}</p>
   <p class="muted" style="margin:4px 0 0">Kosten: ${esc(g.cost||"–")}${v.missing.length&&v.status==="missing"?` · Es fehlt: ${esc(v.missing.join(", "))}`:""}</p>
   ${res}
   ${uris?`<div style="margin-top:10px"><b style="font-size:14px">${v.id==="steam"?"Adressen (nichts einzutragen)":"Diese Adressen beim Anbieter eintragen"}</b>${uris}</div>`:""}
   <details class="adet"${v.status==="missing"?" open":""}><summary>Schritt für Schritt einrichten</summary><ol>${(g.steps||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
    ${g.url?`<div class="links"><a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.link||"Konsole öffnen")}</a></div>`:""}</details>
   <div class="auf">${v.fields.map(f=>auField(v.id,f)).join("")}</div>
   <div class="acts"><button class="btn p" data-ausave="${v.id}">Speichern</button><button class="btn g" data-autest="${v.id}">Testen</button>${v.canProbe?`<a class="btn g" href="/auth/${v.id}?probe=1">Probe-Anmeldung</a>`:""}${v.fields.some(f=>f.set&&!f.env)?`<button class="btn r" data-audel="${v.id}">Gespeicherte Daten löschen</button>`:""}</div>
  </div>`;
}
function drawAuth(){
  const a=AU,ok=a.providers.filter(p=>p.status==="ok").length;
  $("#m").innerHTML=tabsHTML()+`<div class="card"><b>Anmeldung und Konto-Erstellung</b>
   <p class="muted" style="margin:6px 0 0">Kunden melden sich mit einem Tipp an – beim ersten Mal entsteht das Konto automatisch. Im Shop erscheinen nur Anbieter, die hier eingerichtet sind (${ok} von ${a.providers.length}). Änderungen gelten sofort, ohne Neustart. Schlüssel werden verschlüsselt gespeichert und hier nie wieder angezeigt; Railway-Variablen haben Vorrang.</p>
   <p class="muted" style="margin:6px 0 0">Shop-Adresse: <b>${esc(a.origin)}</b>${a.alt?` (Zweitadresse ${esc(a.alt)})`:""}. Konten mit Steam, Handy, Microsoft oder Amazon bestätigen ihre E-Mail einmal per Code, bevor dorthin Codes gehen.</p>
   ${a.sim?`<div class="warnbox"><b>Vorschau:</b> Anbieter ohne Zugangsdaten laufen gegen einen Simulator, damit alle Knöpfe getestet werden können. Live ist die Simulation immer aus.</div>`:""}
   <div class="ausum">${a.providers.map(p=>`<a href="#au-${p.id}" data-aujump="${p.id}"><span class="dot ${p.status==="ok"?"ok":p.status==="error"?"bad":""}"></span>${esc(p.name)}</a>`).join("")}</div></div>
  ${a.providers.map(auCard).join("")}
  <div class="card"><b><span class="dot ${a.mail?"ok":"bad"}"></span>E-Mail-Code</b><p class="muted" style="margin:6px 0 0">${a.mail?"Aktiv: Kunden bekommen einen 6-stelligen Code per E-Mail (Resend).":"RESEND_API_KEY fehlt – ohne E-Mail-Versand gibt es keinen E-Mail-Code."} Nichts einzurichten.</p></div>
  <div class="card"><b><span class="dot ok"></span>Passkey (Face ID, Touch ID, Windows Hello)</b><p class="muted" style="margin:6px 0 0">Aktiv für die Domain <b>${esc(a.passkey)}</b>. Kunden legen den Passkey im Konto an und melden sich danach mit einem Blick an. Nichts einzurichten.</p></div>
  <div class="card"><b><span class="dot"></span>Klarna</b><p class="muted" style="margin:6px 0 0">„Mit Klarna anmelden“ gibt es nicht über Stripe, sondern nur mit einem eigenen Händlervertrag direkt bei Klarna. Deshalb nicht eingebaut.</p></div>`;
  const on=document.querySelector(".tabs button.on");if(on&&on.scrollIntoView)on.scrollIntoView({inline:"center",block:"nearest"});
}
const auVals=p=>{const c=document.getElementById("au-"+p),v={};c.querySelectorAll("[data-f]").forEach(i=>{if(i.disabled)return;v[i.dataset.f]=i.type==="checkbox"?i.checked:i.value.trim()});if(AU_P8[p])v.privateKey=AU_P8[p].text;return v};
const auReplace=(p,v)=>{const i=AU.providers.findIndex(x=>x.id===p);if(i>-1)AU.providers[i]=v;authErrN=AU.providers.filter(x=>x.status==="error").length;const c=document.getElementById("au-"+p);if(c)c.outerHTML=auCard(v)};
function auP8(p,file){if(!file)return;if(file.size>8000){alert("Das ist keine .p8-Datei (zu groß).");return}const r=new FileReader();r.onload=()=>{AU_P8[p]={name:file.name,text:String(r.result||"")};
  const n=document.getElementById(`au_${p}_privateKey_n`);if(n)n.textContent=`${file.name} gewählt – wird beim Speichern verschlüsselt`;
  const m=/AuthKey_([A-Z0-9]{10})\.p8$/i.exec(file.name),k=document.getElementById(`au_${p}_keyId`);if(m&&k&&!k.value&&!k.disabled)k.value=m[1].toUpperCase()};r.readAsText(file)}
document.addEventListener("click",e=>{const d=e.target.closest("[data-p8]");if(d){const i=document.querySelector(`[data-p8file="${d.dataset.p8}"]`);if(i&&!i.disabled)i.click()}});
document.addEventListener("change",e=>{const i=e.target.closest("[data-p8file]");if(i){auP8(i.dataset.p8file,i.files[0]);i.value=""}});
document.addEventListener("dragover",e=>{const d=e.target.closest("[data-p8]");if(d)e.preventDefault()});
document.addEventListener("drop",e=>{const d=e.target.closest("[data-p8]");if(d){e.preventDefault();auP8(d.dataset.p8,e.dataTransfer.files[0])}});
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-ausave],[data-autest],[data-audel],[data-copy],[data-aujump]");if(!t)return;
  if(t.dataset.aujump){e.preventDefault();const c=document.getElementById("au-"+t.dataset.aujump);c&&c.scrollIntoView({block:"start",behavior:"smooth"});return}
  if(t.dataset.copy!=null){const v=t.dataset.copy;try{await navigator.clipboard.writeText(v)}catch(x){const a=document.createElement("textarea");a.value=v;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(y){}a.remove()}t.textContent="Kopiert";setTimeout(()=>{t.textContent="Kopieren"},1600);return}
  const p=t.dataset.ausave||t.dataset.autest||t.dataset.audel;
  if(t.dataset.ausave){t.disabled=true;try{const j=await API(`/admin/auth/${p}`,{method:"POST",body:{values:auVals(p)}});delete AU_P8[p];auReplace(p,j.provider);toast(j.changed?"Gespeichert – gilt sofort":"Keine Änderung")}catch(x){alert(x.message);t.disabled=false}return}
  if(t.dataset.autest){t.disabled=true;t.textContent="Prüfe …";try{const j=await API(`/admin/auth/${p}/test`,{method:"POST",body:{}});auReplace(p,j.provider);toast(j.ok?"Test bestanden":"Test fehlgeschlagen")}catch(x){alert(x.message);t.disabled=false;t.textContent="Testen"}return}
  if(t.dataset.audel){if(!confirm("Gespeicherte Zugangsdaten für diesen Anbieter löschen? Der Knopf verschwindet sofort aus dem Shop (außer bei Railway-Variablen)."))return;try{const j=await API(`/admin/auth/${p}`,{method:"DELETE"});auReplace(p,j.provider);toast("Gelöscht")}catch(x){alert(x.message)}return}
});

(async()=>{
  try{const me=(await API("/me")).user;
    if(!me||!me.admin){$("#m").innerHTML=`<div class="card"><b>Kein Zugriff</b><p class="muted">Deine Sitzung ist abgelaufen.</p><a class="btn p" href="/">Zum Shop</a></div>`;return}
    try{const ap=await API("/admin/abos/pending");aboN=ap.count;aboU=ap.unmatched}catch(e){}
    const qp=new URLSearchParams(location.search);if(qp.get("tab")==="anmeldung")tab="anmeldung";
    load(true);
  }catch(e){$("#m").innerHTML=`<div class="card">${esc(e.message)}</div>`}
})();
})();
</script>
</body>
</html>
