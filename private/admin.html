<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · instacode</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" href="/favicon.png">
<style>
:root{--bg:#FCFCFF;--s:rgba(255,255,255,.66);--b:rgba(22,24,60,.08);--t:#0E1122;--m:#636A85;--ok:#067647;--warn:#B54708;--v:#6D4BFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(40% 40% at 10% 0%,rgba(139,108,255,.18),transparent 70%),radial-gradient(40% 40% at 95% 10%,rgba(56,214,255,.15),transparent 70%),radial-gradient(50% 50% at 60% 100%,rgba(255,120,210,.12),transparent 70%)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--b)}
header img{width:30px;height:30px;border-radius:9px}
header b{font-size:18px;letter-spacing:-.03em}
header a{margin-left:auto;color:var(--m);font-size:13px;text-decoration:none}
.mode{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}
.mode.test{background:#FEF0C7;color:#93370D}.mode.live{background:#DCFAE6;color:var(--ok)}
main{max-width:980px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tabs button{flex:none;border:1.5px solid var(--b);background:var(--s);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;color:var(--t)}
.tabs button.on{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 52%),linear-gradient(135deg,#8B6CFF,#4F46E5);color:#fff;border-color:transparent}
.n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:10px;background:#F04438;color:#fff;font-size:12px;text-align:center}
.card{background:var(--s);border:1px solid var(--b);border-radius:22px;padding:16px;margin-top:12px;-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);box-shadow:0 1px 0 #fff inset,0 14px 34px -24px rgba(60,40,160,.35)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.muted{color:var(--m);font-size:13px}
.st{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;margin-left:6px}
.it{border-top:1px solid var(--b);margin-top:12px;padding-top:12px}
.hold{margin-top:10px;padding:10px 12px;border-radius:12px;background:#FFFAEB;color:#93370D;font-size:14px}
.auto{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:var(--ok)}
input,textarea,select{width:100%;font:inherit;border:1.5px solid var(--b);border-radius:12px;padding:10px 12px;margin-top:6px;background:#fff;color:var(--t)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--t)}
textarea.codes{font-family:ui-monospace,Menlo,monospace;min-height:140px}
.btn{border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn[disabled]{opacity:.5}
.p{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 52%),linear-gradient(135deg,#8B6CFF,#4F46E5);color:#fff;box-shadow:0 8px 20px -10px rgba(91,75,240,.8)}.r{background:#FEE4E2;color:#B42318}.g{background:var(--bg);color:var(--t);border:1.5px solid var(--b)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
code{font-family:ui-monospace,Menlo,monospace;background:#F6F7FA;padding:4px 8px;border-radius:8px;display:inline-block;margin:6px 6px 0 0;word-break:break-all}
.empty{text-align:center;color:var(--m);padding:40px 10px}
label.chk{display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:600}
label.chk input{width:auto;margin:0}
.grid2{display:grid;gap:10px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--m);margin-top:10px}
.stock{width:100%;border-collapse:collapse;font-size:14px}
.stock td{padding:9px 6px;border-top:1px solid var(--b);vertical-align:top}
.stock tr:first-child td{border-top:0}
.chip{display:inline-block;margin:2px 4px 2px 0;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--b);font-size:13px;white-space:nowrap}
.chip.zero{background:#FEF3F2;border-color:#FECDCA;color:#B42318}
.chip i{font-style:normal;color:var(--warn);font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--t);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.pfil{display:grid;grid-template-columns:1fr 200px;gap:8px;margin-top:12px}
.plist{margin-top:12px;background:var(--s);border:1px solid var(--b);border-radius:18px;overflow:hidden}
.prow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--b)}
.prow:first-child{border-top:0}
.prow.off{opacity:.55}
.thumb{width:96px;aspect-ratio:1.586;border-radius:10px;display:grid;place-items:center;overflow:hidden;font-weight:800;font-size:11px;text-align:center;padding:6px;line-height:1.1;box-shadow:0 4px 10px rgba(11,15,25,.12)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pacts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.sw{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;cursor:pointer;color:var(--m)}
.sw input{appearance:none;-webkit-appearance:none;width:38px;height:22px;margin:0;padding:0;border:0;border-radius:11px;background:#D0D5DD;cursor:pointer;position:relative;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked{background:var(--ok)}
.sw input:checked::after{transform:translateX(16px)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--m);background:var(--bg);border:1px solid var(--b);border-radius:6px;padding:1px 6px;margin-left:6px}
.stars{color:#F79009;letter-spacing:1px}
.pl{display:grid;gap:8px}.plr{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--b)}.plr:first-child{border-top:0}
.plv{width:84px;height:36px;border:1px solid var(--b);border-radius:8px;display:grid;place-items:center;background:#fff;overflow:hidden}.plv img{max-width:90%;max-height:80%}.plv i{font-size:11px;color:var(--m);font-style:normal}
.rv.hid{opacity:.55}
@media(max-width:640px){.prow{grid-template-columns:72px minmax(0,1fr)}.thumb{width:72px}.pacts{grid-column:1/-1;justify-content:flex-start}.pfil{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{padding:14px;border-radius:18px;background:var(--s);border:1px solid var(--b);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.kpi small{display:block;color:var(--m);font-size:12.5px}.kpi b{display:block;font-size:22px;letter-spacing:-.02em;margin-top:2px}
.svc{display:grid;gap:10px;margin-top:12px}@media(min-width:760px){.svc{grid-template-columns:repeat(2,minmax(0,1fr))}}
.svc .card{margin-top:0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#D0D5DD}.dot.ok{background:#12B76A}.dot.warn{background:#F79009}.dot.bad{background:#F04438}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.links a{font-size:13px;font-weight:700;color:var(--t);text-decoration:none;padding:7px 12px;border-radius:999px;border:1px solid var(--b);background:#fff}
.drop{margin-top:10px;border:1.5px dashed rgba(109,75,255,.35);border-radius:16px;padding:18px;text-align:center;background:rgba(109,75,255,.04);cursor:pointer}
.drop.on{background:rgba(109,75,255,.1)}
table.pv{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}table.pv td{padding:8px 6px;border-top:1px solid var(--b)}
.warnbox{margin-top:10px;padding:10px 12px;border-radius:12px;background:#FFFAEB;color:#93370D;font-size:13.5px}
</style>
</head>
<body>
<header><img src="/logo.svg" alt=""><b>instacode Admin</b><span id="mode"></span><a href="/">Zum Shop</a></header>
<main id="m"><p class="muted">Lade …</p></main>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{"use strict";
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=c=>(c/100).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
async function API(p,o={}){const r=await fetch("/api"+p,{method:o.method||"GET",headers:{"Content-Type":"application/json","X-IC":"1"},body:o.body?JSON.stringify(o.body):undefined,credentials:"same-origin"});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||"Fehler "+r.status);return j}
const TABS=[["overview","Übersicht"],["processing","Prüfen"],["payment_pending","Zahlung läuft"],["delivered","Geliefert"],["refunded","Erstattet"],["canceled","Storniert"],["all","Alle"],["stock","Code-Lager"],["products","Produkte"],["reviews","Bewertungen"],["reloadly","Reloadly"]];
const STC={awaiting_payment:"#B54708",payment_pending:"#B54708",processing:"#3B5BDB",delivered:"#067647",canceled:"#6B7280",refunded:"#6B7280"};
const STN={awaiting_payment:"Warte auf Zahlung",payment_pending:"Zahlung läuft",processing:"Prüfen",delivered:"Geliefert",canceled:"Storniert",refunded:"Erstattet"};
let tab="overview",timer,tt,counts={},mode=null;
const toast=t=>{const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2800)};
const typing=()=>[...document.querySelectorAll("main input:not([type=checkbox]),main textarea")].some(i=>i.value);
const setMode=j=>{if(j.testmode==null)return;mode=j;$("#mode").innerHTML=j.testmode?`<span class="mode test">Testmodus</span>`:`<span class="mode live">Live</span>`};
const tabsHTML=()=>`<div class="tabs">${TABS.map(t=>`<button class="${t[0]===tab?"on":""}" data-tab="${t[0]}">${t[1]}${t[0]==="processing"&&counts.processing?`<span class="n">${counts.processing}</span>`:""}</button>`).join("")}</div>`;

async function load(force){
  clearTimeout(timer);
  if(tab==="stock"){if(force)loadStock();return}
  if(tab==="products"){if(force)loadProducts();return}
  if(tab==="reviews"){if(force)loadReviews();return}
  if(tab==="reloadly"){if(force)loadRL();return}
  if(tab==="overview"){if(force)loadOV();return}
  timer=setTimeout(()=>load(),30000);
  if(!force&&typing())return;
  try{const j=await API("/admin/orders?status="+tab);counts=j.counts||{};setMode(j);render(j)}catch(e){$("#m").innerHTML=`<div class="card">${esc(e.message)}</div>`}
}
function render(j){
  document.title=(counts.processing?`(${counts.processing}) `:"")+"Admin · instacode";
  $("#m").innerHTML=tabsHTML()+(j.orders.length?j.orders.map(card).join(""):`<div class="empty">${tab==="processing"?"Nichts zu prüfen. Bezahlte Bestellungen werden automatisch ausgeliefert.":"Keine Bestellungen in dieser Ansicht."}</div>`);
}
const fill=i=>i.stock==null?"leer lassen: Testcode wird erzeugt":i.stock>0?`leer lassen: aus Lager (${i.stock} frei)`:"Lager leer, bitte Code eintragen";
function card(o){
  const open=o.status==="processing";
  return `<div class="card" data-o="${esc(o.id)}"><div class="row"><div><b>${esc(o.id)}</b><span class="st" style="color:${STC[o.status]};background:${STC[o.status]}1a">${STN[o.status]||esc(o.status)}</span>${o.delivered_by==="auto"?`<span class="auto">automatisch</span>`:""}
   <div class="muted">${new Date(o.created_at).toLocaleString("de-DE")} · ${esc(o.email)}${o.paid_at?" · bezahlt "+new Date(o.paid_at).toLocaleString("de-DE"):""}</div></div><b>${eur(o.total)}</b></div>
   ${open&&o.hold_reason?`<div class="hold"><b>Nicht automatisch geliefert:</b> ${esc(o.hold_reason)}</div>`:""}
   ${o.items.map(i=>`<div class="it"><b>${esc(i.name)} ${eur(i.face)}</b> × ${i.qty} <span class="muted">${i.type==="topup"?"Aufladung für "+esc(i.phone):i.gift_to?"Geschenk an "+esc(i.gift_to)+(i.gift_from?" von "+esc(i.gift_from):""):"Code"}</span>${i.gift_msg?`<div class="muted">„${esc(i.gift_msg)}“</div>`:""}
    ${open?(i.type==="topup"?`<label class="chk"><input type="checkbox" data-done="${i.id}"> Aufladung beim Anbieter ausgeführt</label><input placeholder="Referenz oder Transaktionsnummer (optional)" data-ref="${i.id}">`
      :Array.from({length:i.qty},(_,k)=>`<input placeholder="Code${i.qty>1?" "+(k+1):""} · ${fill(i)}" data-code="${i.id}" autocomplete="off" autocapitalize="characters" spellcheck="false">`).join(""))
      :(i.codes&&i.codes.length?`<div>${i.codes.map(x=>`<code>${esc(x)}</code>`).join("")}</div>`:"")}</div>`).join("")}
   ${open?`<textarea placeholder="Interne Notiz (optional, sieht nur das Team)" data-note rows="2"></textarea><div class="acts"><button class="btn p" data-deliver="${esc(o.id)}">Ausliefern und E-Mail senden</button><button class="btn g" data-rlbuy="${esc(o.id)}">Über Reloadly kaufen und ausliefern</button><button class="btn r" data-refund="${esc(o.id)}">Erstatten</button></div>`:o.note?`<div class="muted" style="margin-top:10px">Notiz: ${esc(o.note)}</div>`:""}
   ${o.status==="payment_pending"?`<div class="acts"><button class="btn r" data-refund="${esc(o.id)}">Erstatten</button></div>`:""}</div>`;
}

/* ---------- Code-Lager ---------- */
let S=null;
async function loadStock(){
  try{S=await API("/admin/stock");setMode(S);renderStock()}catch(e){$("#m").innerHTML=tabsHTML()+`<div class="card">${esc(e.message)}</div>`}
}
const optP=()=>S.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
const optA=id=>{const p=S.products.find(x=>x.id===id)||S.products[0];return p.amts.map(a=>`<option value="${a.a}">${esc(a.label||a.a+" €")}</option>`).join("")};
function renderStock(){
  const r=S.rules,t=S.testmode;
  const chips=p=>p.amts.map(a=>{const free=t?a.test_free:a.free;return `<span class="chip${!t&&!a.free?" zero":""}">${a.a} € · <b>${free}</b> frei${t&&a.free?` · <i>${a.free} echt</i>`:""}</span>`}).join("");
  $("#m").innerHTML=tabsHTML()+`
  <div class="card"><b>So wird ausgeliefert</b>
   <p class="muted" style="margin:6px 0 0">${r.auto?`Bezahlte Bestellungen gehen sofort raus, wenn der Bestellwert bis ${eur(r.max)} beträgt, der Kunde heute nicht mehr als ${eur(r.day)} automatisch bekommen hat und Stripe das Risiko als normal einstuft. Handy-Aufladungen und alles andere landen unter „Prüfen“.`:"Automatische Auslieferung ist ausgeschaltet (AUTO_DELIVERY=0). Alle Bestellungen landen unter „Prüfen“."}</p>
   ${t?`<p class="muted" style="margin:8px 0 0"><b style="color:#93370D">Testmodus:</b> Testkäufe bekommen nur Testcodes. ${S.generator?"Fehlen welche, erzeugt der Generator sie automatisch.":""} Echte Codes bleiben für den Live-Betrieb reserviert.</p>`:`<p class="muted" style="margin:8px 0 0"><b style="color:#067647">Live:</b> Es werden nur echte Codes aus dem Lager verkauft. Leere Beträge erscheinen im Shop als ausverkauft.</p>`}
  </div>
  <div class="grid2">
   <div class="card" style="margin-top:12px"><b>Codes hochladen</b><p class="muted" style="margin:4px 0 0">Ein Code pro Zeile. Doppelte Codes werden übersprungen.</p>
    <label class="lbl" for="upB">Produkt</label><select id="upB" data-sync="upA">${optP()}</select>
    <label class="lbl" for="upA">Betrag</label><select id="upA">${optA(S.products[0].id)}</select>
    <label class="lbl" for="upC">Codes</label><textarea id="upC" class="codes" placeholder="XXXX-XXXX-XXXX&#10;YYYY-YYYY-YYYY"></textarea>
    ${t?`<label class="chk"><input type="checkbox" id="upT"> Als Testcodes hochladen (nur für Testkäufe)</label>`:""}
    <div class="acts"><button class="btn p" data-up>Hochladen</button></div></div>
   <div class="card" style="margin-top:12px"><b>Codes aus Datei importieren</b><p class="muted" style="margin:4px 0 0">Textdatei (.txt oder .csv) hochladen. Produkt und Betrag werden pro Zeile erkannt, zum Beispiel „Steam 20 € XXXX-XXXX-XXXX“ oder eine Überschrift „Amazon 25 €“ über mehreren Codes. Was nicht erkannt wird, bekommt das Produkt unten.</p>
    <div class="drop" id="fDrop"><b>Datei hierher ziehen</b><br><span class="muted">oder tippen zum Auswählen</span><input type="file" id="fFile" accept=".txt,.csv,text/plain,text/csv" hidden></div>
    <label class="lbl" for="fB">Produkt für nicht erkannte Zeilen (optional)</label><select id="fB" data-sync="fA"><option value="">– keins –</option>${optP()}</select>
    <label class="lbl" for="fA">Betrag</label><select id="fA"><option value="">–</option></select>
    ${t?`<label class="chk"><input type="checkbox" id="fT"> Als Testcodes importieren</label>`:""}
    <div id="fPrev"></div></div>
   ${S.generator?`<div class="card" style="margin-top:12px"><b>Testcode-Generator</b><p class="muted" style="margin:4px 0 0">Erzeugt Codes im Format TEST-XXXX-XXXX-XXXX. Nur im Testmodus, nicht einlösbar.</p>
    <label class="lbl" for="genB">Produkt</label><select id="genB" data-sync="genA">${optP()}</select>
    <label class="lbl" for="genA">Betrag</label><select id="genA">${optA(S.products[0].id)}</select>
    <label class="lbl" for="genN">Anzahl</label><input id="genN" type="number" min="1" max="500" value="10">
    <div class="acts"><button class="btn p" data-gen>Testcodes erzeugen</button><button class="btn g" data-purge>Freie Testcodes löschen</button></div></div>`:""}
  </div>
  <div class="card"><b>Bestand</b><span class="muted"> · ${t?"freie Testcodes":"freie Codes"} pro Betrag</span>
   <table class="stock" style="margin-top:8px">${S.products.map(p=>`<tr><td style="width:34%"><b>${esc(p.name)}</b></td><td>${chips(p)}</td></tr>`).join("")}</table></div>`;
}

/* ---------- Produkte: Bilder und Sichtbarkeit ---------- */
const CATN={topup:"Handy aufladen",keys:"Spiele-Keys",gaming:"Gaming-Guthaben",currency:"Spielwährungen",subs:"Abos",apps:"App Stores",entertainment:"Streaming & Musik",shopping:"Shopping & Essen",software:"Software",payment:"Prepaid-Karten"};
const PLATN={steam:"Steam",pc:"PC",ea:"EA app",bnet:"Battle.net",ubi:"Ubisoft Connect",rockstar:"Rockstar",ps5:"PS5",xbox:"Xbox",xpc:"Xbox & PC",switch:"Switch",switch2:"Switch 2"};
let P=null,PQ="",PC="all";
async function loadProducts(){
  try{P=(await API("/admin/products")).products;renderProducts()}catch(e){$("#m").innerHTML=tabsHTML()+`<div class="card">${esc(e.message)}</div>`}
}
const prow=p=>`<div class="prow${p.active?"":" off"}" data-p="${esc(p.id)}">
  <div class="thumb" style="background:${esc(p.bg)};color:${esc(p.fg||"#fff")}">${p.img?`<img src="${esc(p.img)}" alt="">`:p.logo?`<img src="${esc(p.logo)}" alt="" style="object-fit:contain;max-width:72%;max-height:60%">`:esc(p.name)}</div>
  <div style="min-width:0"><b>${esc(p.name)}</b>${p.plat?`<span class="tag">${esc(PLATN[p.plat]||p.plat)}</span>`:""}${p.img?`<span class="tag" style="color:var(--ok)">eigenes Bild</span>`:""}${p.logo?`<span class="tag" style="color:var(--ok)">Logo</span>`:""}
   <div class="muted">${esc(CATN[p.cat]||p.cat)} · ${esc(p.id)}</div>
   <div class="muted">${p.amts.map((a,i)=>p.labels&&p.labels[i]?`${esc(p.labels[i])} ${eur(Math.round(a*100))}`:eur(Math.round(a*100))).join(" · ")}</div></div>
  <div class="pacts"><label class="sw"><input type="checkbox" data-act="${esc(p.id)}"${p.active?" checked":""}>${p.active?"im Shop":"versteckt"}</label>
   <button class="btn g sm" data-picklogo="${esc(p.id)}">${p.logo?"Logo ersetzen":"Logo"}</button>${p.logo?`<button class="btn r sm" data-dellogo="${esc(p.id)}">Logo weg</button>`:""}<button class="btn g sm" data-pick="${esc(p.id)}">${p.img?"Kartenbild ersetzen":"Kartenbild"}</button>${p.img?`<button class="btn r sm" data-delimg="${esc(p.id)}">Bild weg</button>`:""}</div></div>`;

  if(e.target.id==="plfile"){const f=e.target.files[0];e.target.value="";if(f&&plFor){try{const j=await uploadTo(`/api/admin/paylogos/${plFor}`,f);drawPayLogos(Object.keys(PLN),j.logos);toast("Zahlungslogo gespeichert")}catch(x){alert(x.message)}}return}
  const a=e.target.closest("[data-act]");
  if(a){const id=a.dataset.act,on=a.checked;try{await API(`/admin/products/${encodeURIComponent(id)}`,{method:"POST",body:{active:on}});const p=P.find(x=>x.id===id);p.active=on;drawProducts();toast(on?"Wieder im Shop":"Im Shop versteckt")}catch(x){alert(x.message);a.checked=!on}}
});
document.addEventListener("change",e=>{const s=e.target.closest("[data-sync]");if(s)$("#"+s.dataset.sync).innerHTML=optA(s.value)});
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-tab],[data-deliver],[data-refund],[data-up],[data-gen],[data-purge],[data-pick],[data-picklogo],[data-dellogo],[data-pl],[data-pldel],[data-delimg],[data-rhide]");if(!t)return;
  if(t.dataset.pick){pickFor=t.dataset.pick;pickKind="image";$("#pfile").click();return}
  if(t.dataset.picklogo){pickFor=t.dataset.picklogo;pickKind="logo";$("#pfile").click();return}
  if(t.dataset.dellogo){try{await API(`/admin/products/${encodeURIComponent(t.dataset.dellogo)}/logo`,{method:"DELETE"});P.find(x=>x.id===t.dataset.dellogo).logo=null;drawProducts();toast("Logo entfernt")}catch(x){alert(x.message)}return}
  if(t.dataset.pl){plFor=t.dataset.pl;$("#plfile").click();return}
  if(t.dataset.pldel){try{const j=await API(`/admin/paylogos/${t.dataset.pldel}`,{method:"DELETE"});drawPayLogos(Object.keys(PLN),j.logos);toast("Entfernt")}catch(x){alert(x.message)}return}
  if(t.dataset.delimg){if(!confirm("Eigenes Bild entfernen? Der Shop zeigt dann wieder die gestaltete Karte."))return;try{await API(`/admin/products/${encodeURIComponent(t.dataset.delimg)}/image`,{method:"DELETE"});P.find(x=>x.id===t.dataset.delimg).img=null;drawProducts();toast("Bild entfernt")}catch(x){alert(x.message)}return}
  if(t.dataset.rhide){try{await API(`/admin/reviews/${t.dataset.rhide}`,{method:"POST",body:{hidden:t.dataset.h==="1"}});loadReviews();toast(t.dataset.h==="1"?"Versteckt":"Wieder sichtbar")}catch(x){alert(x.message)}return}
  if(t.dataset.tab){tab=t.dataset.tab;load(true);return}
  if(t.hasAttribute("data-up")){
    t.disabled=true;
    try{const j=await API("/admin/codes",{method:"POST",body:{brand:$("#upB").value,a:+$("#upA").value,codes:$("#upC").value,test:!!($("#upT")&&$("#upT").checked)}});toast(`${j.added} Codes hinzugefügt${j.duplicates?`, ${j.duplicates} doppelt übersprungen`:""}`);loadStock()}
    catch(x){alert(x.message);t.disabled=false}return}
  if(t.hasAttribute("data-gen")){
    t.disabled=true;
    try{const j=await API("/admin/codes/generate",{method:"POST",body:{brand:$("#genB").value,a:+$("#genA").value,count:+$("#genN").value}});toast(`${j.added} Testcodes erzeugt`);loadStock()}
    catch(x){alert(x.message);t.disabled=false}return}
  if(t.hasAttribute("data-purge")){
    if(!confirm("Alle freien Testcodes löschen?"))return;
    try{const j=await API("/admin/codes/purge-test",{method:"POST"});toast(`${j.removed} Testcodes gelöscht`);loadStock()}catch(x){alert(x.message)}return}
  const box=t.closest("[data-o]");
  if(t.dataset.deliver){
    const items={};
    box.querySelectorAll("[data-code]").forEach(i=>{const k=i.dataset.code;(items[k]=items[k]||{id:+k,codes:[]}).codes.push(i.value.trim())});
    box.querySelectorAll("[data-done]").forEach(i=>{const k=i.dataset.done;items[k]={id:+k,done:i.checked,ref:(box.querySelector(`[data-ref="${k}"]`)||{}).value||""}});
    if(!confirm("Jetzt ausliefern? Der Kunde bekommt die Codes sofort per E-Mail."))return;
    t.disabled=true;
    try{await API(`/admin/orders/${encodeURIComponent(t.dataset.deliver)}/deliver`,{method:"POST",body:{items:Object.values(items),note:(box.querySelector("[data-note]")||{}).value||""}});box.querySelectorAll("input,textarea").forEach(i=>i.value="");toast("Ausgeliefert, E-Mail ist raus");load(true)}
    catch(x){alert(x.message);t.disabled=false}
  }
  if(t.dataset.refund){
    const reason=prompt("Grund für die Erstattung (wird dem Kunden mitgeteilt):","Artikel derzeit nicht verfügbar");if(reason===null)return;
    t.disabled=true;
    try{await API(`/admin/orders/${encodeURIComponent(t.dataset.refund)}/refund`,{method:"POST",body:{reason}});toast("Erstattet");load(true)}
    catch(x){alert(x.message);t.disabled=false}
  }
});
(async()=>{
  try{const me=(await API("/me")).user;
    if(!me||!me.admin){$("#m").innerHTML=`<div class="card"><b>Kein Zugriff</b><p class="muted">Deine Sitzung ist abgelaufen.</p><a class="btn p" href="/">Zum Shop</a></div>`;return}
    load(true);
  }catch(e){$("#m").innerHTML=`<div class="card">${esc(e.message)}</div>`}
})();
})();
</script>
</body>
</html>
